services:
  - type: web
    name: my-profile
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /health.html
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
        - key: APP_URL
          value: https://my-profile-5x5b.onrender.com
        - key: LOG_CHANNEL
          value: stderr
